[project]
name = "detecting-pipeline-leaks-from-space-multi-sensor-satellite-monitoring-at-scale-w"
version = "0.1.0"
description = "Companion code for Medium article: detecting pipeline leaks from space multi sensor satellite monitoring at scale with databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pytest>=8.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "signalplot>=0.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# Optional Rust extension — build with:
#   pip install maturin && maturin develop --release -m rust/py/Cargo.toml
[tool.maturin]
manifest-path = "rust/py/Cargo.toml"
module-name = "detecting_pipeline_leaks_from_space_multi_sensor_satellite_monitoring_at_scale_with_databricks_rs"

